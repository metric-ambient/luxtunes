# Builds a Windows installer to try out, without making a release.
# Run it from GitHub: Actions → Windows test build → Run workflow.
#
# The installer goes into a draft release named "windows-test" (Releases page,
# at the top). A draft is only visible to you: it has no tag, isn't "latest",
# and LuxTunes' Check for Updates never sees it. Each run replaces it.
#
# Safety, as in release.yml: actions are pinned to exact commits, packages to
# packaging/build-constraints.txt, FFmpeg's sources are checked before use
# (build_ffmpeg.sh), and only the steps that publish are given the token.
name: Windows test build

on:
  workflow_dispatch:

permissions:
  contents: read           # each job asks for what it needs

env:
  DRAFT: windows-test

jobs:
  ffmpeg:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # to make the draft release and put FFmpeg in it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - name: Build FFmpeg for Windows
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q build-essential nasm pkg-config curl git gnupg \
            mingw-w64 libz-mingw-w64-dev zip
          bash packaging/appimage/build_ffmpeg.sh build/ffmpeg-windows --windows
          (cd build/ffmpeg-windows && zip -q ../ffmpeg-windows.zip *)

      - name: Start the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete "$DRAFT" --yes 2>/dev/null || true
          gh release create "$DRAFT" --draft --target "$GITHUB_SHA" \
            --title "Windows test build" \
            --notes "A test installer from $GITHUB_SHA. Not a release." \
            build/ffmpeg-windows.zip

  installer:
    needs: ffmpeg
    runs-on: windows-2022      # has Inno Setup 6
    permissions:
      contents: write      # to add the installer to the draft release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"

      - name: Get FFmpeg
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$DRAFT" --pattern ffmpeg-windows.zip --dir build
          python -m zipfile -e build/ffmpeg-windows.zip build/ffmpeg-windows

      - name: Test the iPod engine on Windows
        run: |
          python -m pip install -q -c packaging/build-constraints.txt . pyinstaller pytest
          python -m pytest -q tests/test_itdb.py tests/test_windows.py

      - name: Build the installer
        run: python packaging/windows/build.py build/ffmpeg-windows

      - name: Add it to the draft release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$DRAFT" dist/LuxTunes-*-Setup.exe --clobber
          gh release delete-asset "$DRAFT" ffmpeg-windows.zip --yes
