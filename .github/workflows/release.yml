# Builds a release whenever a version tag is pushed, e.g.:
#     git tag v0.3.0 && git push origin v0.3.0
# The tag must match __version__ in src/luxtunes/__init__.py. The release gets:
#   * LuxTunes-x86_64.AppImage: the ready-to-run app (packaging/appimage/build.sh)
#   * a .whl package, for copies installed with packaging/install.sh
# Help → Check for Updates… in LuxTunes downloads whichever one it needs.
#
# Safety: actions are pinned to exact commits (a tag can be moved), every
# package is pinned in packaging/build-constraints.txt, appimagetool is pinned
# with its checksum (build.sh), and the repository token isn't left on disk for
# the tests and builds to find: only the steps that publish are given it.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read           # each job asks for what it needs

jobs:
  release:
    runs-on: ubuntu-24.04
    permissions:
      contents: write      # to create the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"

      - name: Check the tag matches the version
        run: |
          version=$(python -c "import ast, pathlib; t = pathlib.Path('src/luxtunes/__init__.py').read_text(); print([n.value.value for n in ast.parse(t).body if isinstance(n, ast.Assign) and n.targets[0].id == '__version__'][0])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match __version__ $version"; exit 1
          fi

      - name: Run the tests that need no screen or devices
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
          python -m pip install -q -c packaging/build-constraints.txt mutagen numpy pytest
          PYTHONPATH=src python -m pytest -q --ignore=tests/test_ui_smoke.py --ignore=tests/test_gpod.py

      - name: Build
        run: |
          python -m pip install -q -c packaging/build-constraints.txt build
          python -m build

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The description is the tag's message (release.sh's second argument).
          # (checkout leaves the tag without its message, so it's fetched again.)
          git fetch -q --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          git tag -l --format='%(contents)' "$GITHUB_REF_NAME" > notes.txt
          if grep -q '[^[:space:]]' notes.txt; then
            gh release create "$GITHUB_REF_NAME" dist/* --title "LuxTunes ${GITHUB_REF_NAME#v}" --notes-file notes.txt
          else
            gh release create "$GITHUB_REF_NAME" dist/* --title "LuxTunes ${GITHUB_REF_NAME#v}" --generate-notes
          fi

  appimage:
    needs: release
    runs-on: ubuntu-24.04      # the oldest system it runs on: Ubuntu 24.04 / Mint 22
    permissions:
      contents: write      # to add the AppImage to the release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5.6.0
        with:
          python-version: "3.12"

      - name: Build the AppImage
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libxcb-cursor0 desktop-file-utils
          python -m pip install -q -c packaging/build-constraints.txt . pyinstaller
          bash packaging/appimage/build.sh

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" dist/LuxTunes-x86_64.AppImage --clobber
