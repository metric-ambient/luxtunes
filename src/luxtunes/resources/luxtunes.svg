<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="50%" cy="25%" r="85%">
      <stop offset="0" stop-color="#8ad6ff"/>
      <stop offset="0.5" stop-color="#2f8be3"/>
      <stop offset="1" stop-color="#0b3a92"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#082456" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d3d9e4"/>
    </linearGradient>
  </defs>
  <circle cx="128" cy="128" r="120" fill="url(#bg)"/>
  <g fill="#14161c">
    <!-- feet -->
    <ellipse cx="106" cy="222" rx="20" ry="8"/>
    <ellipse cx="150" cy="222" rx="20" ry="8"/>
    <!-- flippers, held out a little -->
    <ellipse cx="72" cy="160" rx="13" ry="40" transform="rotate(28 72 160)"/>
    <ellipse cx="184" cy="160" rx="13" ry="40" transform="rotate(-28 184 160)"/>
    <!-- body and head, one shape -->
    <path d="M128 42 C 158 42 172 64 172 92 C 172 104 168 112 170 122
             C 186 146 190 176 182 198 C 174 218 152 226 128 226
             C 104 226 82 218 74 198 C 66 176 70 146 86 122
             C 88 112 84 104 84 92 C 84 64 98 42 128 42 Z"/>
    <!-- beak, pointing down -->
    <path d="M118 112 L138 112 L128 130 Z"/>
  </g>
  <!-- headband -->
  <path fill="none" stroke="#14161c" stroke-width="17" stroke-linecap="round" d="M82 92 C 80 22, 176 22, 174 92"/>
  <path fill="none" stroke="url(#cup)" stroke-width="10" stroke-linecap="round" d="M82 92 C 80 22, 176 22, 174 92"/>
  <!-- ear cups -->
  <rect x="64" y="70" width="32" height="52" rx="14" fill="url(#cup)" stroke="#14161c" stroke-width="3.5"/>
  <rect x="160" y="70" width="32" height="52" rx="14" fill="url(#cup)" stroke="#14161c" stroke-width="3.5"/>
  <circle cx="128" cy="128" r="120" fill="none" stroke="url(#rim)" stroke-width="4"/>
</svg>
